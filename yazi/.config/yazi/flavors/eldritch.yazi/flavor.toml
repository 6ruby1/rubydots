# vim:fileencoding=utf-8:foldmethod=marker

# Eldritch Theme Manager Spec

# : Manager {{{

[mgr]
cwd = { fg = "#04d1f9" } # Cyan

# Hovered
hovered = { reversed = true }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "#f1fc79", bold = true, italic = true, underline = true } # Yellow
find_position = { fg = "#f265b5", bg = "reset", bold = true, italic = true }    # Pink

# Marker
marker_copied = { fg = "#37f499", bg = "#37f499" }   # Green
marker_cut = { fg = "#f16c75", bg = "#f16c75" }      # Red
marker_marked = { fg = "#04d1f9", bg = "#04d1f9" }   # Cyan
marker_selected = { fg = "#f1fc79", bg = "#f1fc79" } # Yellow

# Count
count_copied = { fg = "#212337", bg = "#37f499" }   # Background, Green
count_cut = { fg = "#212337", bg = "#f16c75" }      # Background, Red
count_selected = { fg = "#212337", bg = "#f1fc79" } # Background, Yellow

# Border
border_symbol = "│"
border_style = { fg = "#a48cf2" } # Purple

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#212337", bg = "#a48cf2", bold = true } # Background, Purple
inactive = { fg = "#a48cf2", bg = "#323449" }            # Purple, Current Line

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#212337", bg = "#a48cf2", bold = true }
normal_alt = { fg = "#a48cf2", bg = "#323449" }

# Select mode
select_main = { fg = "#212337", bg = "#04d1f9", bold = true }
select_alt = { fg = "#04d1f9", bg = "#323449" }

# Unset mode
unset_main = { fg = "#212337", bg = "#f7c67f", bold = true } # Background, Orange
unset_alt = { fg = "#f7c67f", bg = "#323449" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep = { fg = "#a48cf2" }
perm_type = { fg = "#a48cf2" }
perm_read = { fg = "#f1fc79" }
perm_write = { fg = "#f16c75" }
perm_exec = { fg = "#37f499" }

# Progress
progress_label = { fg = "#ebfafa", bold = true }     # Foreground
progress_normal = { fg = "#a48cf2", bg = "#323449" }
progress_error = { fg = "#a48cf2", bg = "#f16c75" }

# : }}}


# : Pick {{{

[pick]
border = { fg = "#a48cf2" }
active = { fg = "#f265b5", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border = { fg = "#a48cf2" }
title = {}
value = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#a48cf2" }

# : }}}


# : Tasks {{{

[tasks]
border = { fg = "#a48cf2" }
title = {}
hovered = { fg = "#f265b5", bold = true }

# : }}}


# : Which {{{

[which]
mask = { bg = "#323449" }
cand = { fg = "#04d1f9" }
rest = { fg = "#7081d0" }
desc = { fg = "#f265b5" }
separator = "  "
separator_style = { fg = "#a48cf2" }

# : }}}


# : Help {{{

[help]
on = { fg = "#04d1f9" }
run = { fg = "#f265b5" }
hovered = { reversed = true, bold = true }
footer = { fg = "#323449", bg = "#ebfafa" }

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#a48cf2" }
title = { fg = "#a48cf2" }
tbl_col = { fg = "#04d1f9" }
tbl_cell = { fg = "#f265b5", bg = "#323449" }

# : }}}


# : Notification {{{

[notify]
title_info = { fg = "#37f499" }
title_warn = { fg = "#f1fc79" }
title_error = { fg = "#f16c75" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
  # Image
  { mime = "image/*", fg = "#04d1f9" },
  # Media
  { mime = "{audio,video}/*", fg = "#f1fc79" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f265b5" },
  # Document
  { mime = "application/{pdf,doc,rtf}", fg = "#37f499" },
  # Virtual file system
  { mime = "vfs/*", fg = "#7081d0" },
  # Fallback
  { name = "*", fg = "#ebfafa" },
  { name = "*/", fg = "#a48cf2" },
]

# : }}}
