general {
    ignore_dbus_inhibit = true                                             # dont sleep if using firefox
    lock_cmd = pactl set-sink-mute 0 1 && pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = pactl set-sink-mute 0 1 && loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on                             # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 300                                           # 5min
    on-timeout = brightnessctl -s set 100                  # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                           # monitor backlight restore.
}

