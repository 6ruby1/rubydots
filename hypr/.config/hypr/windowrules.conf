# Intellij-IDEA
windowrule = no_initial_focus on, match:class (jetbrains-)(.*), match:title ^win(.*), match:initial_title win.*, match:float 1

# Fix pinentry losing focus
windowrule = stay_focused on, match:class (pinentry-|gcr-)(.*)


