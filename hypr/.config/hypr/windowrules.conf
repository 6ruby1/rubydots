# Browser tags
windowrule = tag +browser, class:^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag +browser, class:^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag +browser, class:^(chrome-.+-Default)$ # Chrome PWAs
windowrule = tag +browser, class:^([Cc]hromium)$
windowrule = tag +browser, class:^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, class:^(libre-wolf)$

# Terminal tags
windowrule = tag +terminal, class:^(kitty|Alacritty)$

# Editor tags
windowrule = tag +editor, class:^(kitty)$, title:(.*)(- Nvim)$
windowrule = tag +editor, class:^(code-oss|codium|VSCodium|VSCode|[Cc]ode)$
windowrule = tag +editor, class:^(code-oss-url-handler|codium-url-handler|code-url-handler)$
windowrule = tag +editor, class:^(jetbrains-.+)$

# File manager tags
windowrule = tag +file-manager, class:^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$
windowrule = tag +file-manager, class:^(kitty)$, title:^(Yazi)(.*)

# Game tags
windowrule = tag +game, class:^(gamescope)$
windowrule = tag +game, class:^(steam_app_\d+)$

# Game store tags
windowrule = tag +gamestore, class:^([Ss]team)$
windowrule = tag +gamestore, title:^([Ll]utris)$

# Multimedia tags
windowrule = tag +multimedia, class:^([Aa]udacious)$

# Multimedia-video tags
windowrule = tag +multimedia-video, class:^([Mm]pv|vlc)$

# Settings tags
windowrule = tag +settings, class:^(kvantummanager)$
windowrule = tag +settings, class:^(nm-applet|nm-connection-editor|blueman-manager)$
windowrule = tag +settings, class:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = tag +settings, class:^(qt5ct|qt6ct|[Yy]ad)$
windowrule = tag +settings, class:(xdg-desktop-portal-gtk)
windowrule = tag +settings, class:^(org.kde.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1)$
windowrule = tag +settings, class:^(nwg-look|nwg-displays)$

