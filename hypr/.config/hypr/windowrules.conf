# Scratchpad yazi
windowrule = float on, match:class ^(scratchpad-yazi)$
windowrule = border_color rgb(37F499), match:class ^(scratchpad-yazi)$
windowrule = border_size 4, match:class ^(scratchpad-yazi)$

# Scratchpad bluetooth
windowrule = float on, match:class ^(scratchpad-bluetooth)$
windowrule = border_color rgb(37F499), match:class ^(scratchpad-bluetooth)$
windowrule = border_size 4, match:class ^(scratchpad-bluetooth)$

# Scratchpad terminal
windowrule = float on, match:class ^(scratchpad-terminal)$
windowrule = border_color rgb(37F499), match:class ^(scratchpad-terminal)$
windowrule = border_size 4, match:class ^(scratchpad-terminal)$

# pyprland expose
windowrule = border_color rgb(37f499) rgb(f16c75), match:workspace s[1]

# Btop 
windowrule = size 80% 80%, match:class ^(btop)$
windowrule = xray on, match:class ^(btop)$
windowrule = opacity 0.70 0.70, match:class ^(btop)$

# termfilechooser
windowrule = float on, match:title ^(termfilechooser)$
windowrule = size 80% 80%, match:title ^(termfilechooser)$
windowrule = xray on, match:title ^(termfilechooser)$
# windowrule = opacity 0.70 0.70, match:title ^(termfilechooser)$

# Blue TUI
windowrule = float on, match:class ^(bluetui)$
windowrule = size 472 379, match:class ^(bluetui)$
windowrule = move 1051 42, match:class ^(bluetui)$
windowrule = opacity 0.7 0.7, match:class ^(bluetui)$

# Pass-sync message
windowrule = float on, match:class ^(pass-sync)$
windowrule = size 60% 60%, match:class ^(pass-sync)$
windowrule = move 20% 20%, match:class ^(pass-sync)$
windowrule = xray on, match:class ^(pass-sync)$
windowrule = opacity 0.90 0.90, match:class ^(pass-sync)$

# Pass show
windowrule = float on, match:class ^(pass-show)$
windowrule = size 40% 40%, match:class ^(pass-show)$
windowrule = move 30% 30%, match:class ^(pass-show)$
windowrule = xray on, match:class ^(pass-show)$
windowrule = opacity 0.90 0.90, match:class ^(pass-show)$

# common modals
windowrule = float on, match:title ^(Open)$
windowrule = float on, match:title ^(Choose Files)$
windowrule = float on, match:title ^(Save As)$
windowrule = float on, match:title ^(Confirm to replace files)$
windowrule = float on, match:title ^(File Operation Progress)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$


