# Scratchpad yazi
windowrulev2 = float,class:^(scratchpad-yazi)$
windowrulev2 = bordercolor rgb(37F499), class:^(scratchpad-yazi)$
windowrulev2 = bordersize 4, class:^(scratchpad-yazi)$

# Scratchpad bluetooth
windowrulev2 = float,class:^(scratchpad-bluetooth)$
windowrulev2 = bordercolor rgb(37F499), class:^(scratchpad-bluetooth)$
windowrulev2 = bordersize 4, class:^(scratchpad-bluetooth)$

# Scratchpad terminal
windowrulev2 = float,class:^(scratchpad-terminal)$
windowrulev2 = bordercolor rgb(37F499), class:^(scratchpad-terminal)$
windowrulev2 = bordersize 4, class:^(scratchpad-terminal)$

# pyprland expose
windowrulev2 = bordercolor rgb(37f499) rgb(f16c75), onworkspace:s[1]

# Btop 
windowrulev2 = size 80% 80%,class:^(btop)$
windowrulev2 = xray,class:^(btop)$
windowrulev2 = opacity 0.70 0.70,class:^(btop)$

# Screensaver0
windowrulev2 = monitor 0, class:^(screensaver0)$
windowrulev2 = fullscreen, class:^(screensaver0)$

# Screensaver1
windowrulev2 = monitor 1, class:^(screensaver1)$
windowrulev2 = fullscreen, class:^(screensaver1)$


# termfilechooser
windowrulev2 = float,title:^(termfilechooser)$
windowrulev2 = size 80% 80%,title:^(termfilechooser)$
windowrulev2 = xray,title:^(termfilechooser)$
# windowrulev2 = opacity 0.70 0.70,title:^(termfilechooser)$

# Blue TUI
windowrulev2 = float,class:^(bluetui)$
windowrulev2 = size 472 379,class:^(bluetui)$
windowrulev2 = move 1051 42,class:^(bluetui)$
windowrulev2 = opacity 0.7 0.7, class:^(bluetui)$

# Pass-sync message
windowrulev2 = float,class:^(pass-sync)$
windowrulev2 = size 60% 60%,class:^(pass-sync)$
windowrulev2 = move 20% 20%,class:^(pass-sync)$
windowrulev2 = xray,class:^(pass-sync)$
windowrulev2 = opacity 0.90 0.90,class:^(pass-sync)$

# Pass show
windowrulev2 = float,class:^(pass-show)$
windowrulev2 = size 40% 40%,class:^(pass-show)$
windowrulev2 = move 30% 30%,class:^(pass-show)$
windowrulev2 = xray,class:^(pass-show)$
windowrulev2 = opacity 0.90 0.90,class:^(pass-show)$

# common modals
windowrule = float,title:^(Open)$
windowrule = float,title:^(Choose Files)$
windowrule = float,title:^(Save As)$
windowrule = float,title:^(Confirm to replace files)$
windowrule = float,title:^(File Operation Progress)$
windowrulev2 = float,class:^(xdg-desktop-portal-gtk)$


