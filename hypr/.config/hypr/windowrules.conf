# ░░▀░░▀░▀░▀▀▀░▀▀▀

# Browser tags
windowrule = tag +browser, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag +browser, match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^(chrome-.+-Default)$ # Chrome PWAs
windowrule = tag +browser, match:class ^([Cc]hromium)$
windowrule = tag +browser, match:class ^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^(libre-wolf)$

# Terminal tags
windowrule = tag +terminal, match:class ^(kitty|Alacritty)$

# Editor tags
windowrule = tag +editor, match:class ^(kitty)$, match:title (.*)(- Nvim)$
windowrule = tag +editor, match:class ^(code-oss|codium|VSCodium|VSCode|[Cc]ode)$
windowrule = tag +editor, match:class ^(code-oss-url-handler|codium-url-handler|code-url-handler)$
windowrule = tag +editor, match:class ^(jetbrains-.+)$

# File manager tags
windowrule = tag +file-manager, match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$
windowrule = tag +file-manager, match:class ^(kitty)$, match:title ^(Yazi)(.*)

# Game tags
windowrule = tag +game, match:class ^(gamescope)$
windowrule = tag +game, match:class ^(steam_app_\d+)$

# Game store tags
windowrule = tag +gamestore, match:class ^([Ss]team)$
windowrule = tag +gamestore, match:title ^([Ll]utris)$

# Multimedia tags
windowrule = tag +multimedia, match:class ^([Aa]udacious)$

# Multimedia-video tags
windowrule = tag +multimedia-video, match:class ^([Mm]pv|vlc)$

# Settings tags
windowrule = tag +settings, match:class ^(kvantummanager)$
windowrule = tag +settings, match:class ^(nm-applet|nm-connection-editor|blueman-manager)$
windowrule = tag +settings, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = tag +settings, match:class ^(qt5ct|qt6ct|[Yy]ad)$
windowrule = tag +settings, match:class (xdg-desktop-portal-gtk)
windowrule = tag +settings, match:class ^(org.kde.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1)$
windowrule = tag +settings, match:class ^(nwg-look|nwg-displays)$

