# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal # Launch Kitty
bind = $mainMod+Shift, T, exec, pypr-client toggle terminal && hyprctl dispatch bringactivetotop
bind = $mainMod, Q, killactive, # Close Active Window
#bind = $mainMod, M, exit,
bind = $mainMod, Y, exec, $terminal yazi
bind = $mainMod, F, exec, $browser # Launch Browser
bind = $mainMod, O, exec, $notes # Launch Obsidian
bind = $mainMod, escape, exec, $terminal --class=btop btop # Launch System Monitor

# Scratchpads
bind = $mainMod+Shift, Y, exec, $fileManager && hyprctl dispatch bringactivetotop # Launch File Manager
bind = $mainMod, B, exec, pypr-client toggle bluetooth && hyprctl dispatch bringactivetotop # Launch File Manager

# Assign Rofi Shortcut variables
$rofiThemeDir = ~/.config/rofi/themes/style-2.rasi
$rofiDrun = pkill -x rofi || rofi -show drun
#$rofiWindow = pkill -x rofi || rofi -show window
$rofiFiles = pkill -x rofi || rofi -show filebrowser 
$rofiGames = pkill -x rofi || rofi -modi games -show games
$rofiConfigEdit = pkill -x rofi || ~/.config/rofi/scripts/configedit.sh

# Rofi menus
bind = $mainMod, A, exec, $rofiDrun # Show Application Launcher
#bind = $mainMod, Tab, exec, $rofiWindow # Show Application Switcher
bind = $mainMod+Shift, E, exec, $rofiFiles # Show Rofi Filemenu 
bind = $mainMod, H, exec, $rofiGames # Show Game Launcher
bind = $mainMod, P, exec, pkill -x rofi || $scrPath/pass-get.sh # Show passmenu
bind = $mainMod, I, exec, $rofiConfigEdit # Show Config Menus
bind = $mainMod, Backspace, exec, pkill -x rofi || $scrPath/powermenu.sh # Show Power Menu
bind = $mainMod, slash, exec, pkill -x rofi || $scrPath/keybinds_hint.sh c # Show Keybindings

bind = $mainMod, V, togglefloating,
bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move focused window to a workspace silently
bind = $mainMod+Alt, 1, movetoworkspacesilent, 1
bind = $mainMod+Alt, 2, movetoworkspacesilent, 2
bind = $mainMod+Alt, 3, movetoworkspacesilent, 3
bind = $mainMod+Alt, 4, movetoworkspacesilent, 4
bind = $mainMod+Alt, 5, movetoworkspacesilent, 5
bind = $mainMod+Alt, 6, movetoworkspacesilent, 6
bind = $mainMod+Alt, 7, movetoworkspacesilent, 7
bind = $mainMod+Alt, 8, movetoworkspacesilent, 8
bind = $mainMod+Alt, 9, movetoworkspacesilent, 9
bind = $mainMod+Alt, 0, movetoworkspacesilent, 10

# Move focused window to a relative workspace
bind = $mainMod+Ctrl+Alt, Right, movetoworkspace, r+1
bind = $mainMod+Ctrl+Alt, Left, movetoworkspace, r-1

# Switch workspaces to a relative workspace
bind = $mainMod+Ctrl, Right, workspace, r+1
bind = $mainMod+Ctrl, Left, workspace, r-1

# Resize windows
binde = $mainMod+Shift, Right, resizeactive, 30 0
binde = $mainMod+Shift, Left, resizeactive, -30 0
binde = $mainMod+Shift, Up, resizeactive, 0 -30
binde = $mainMod+Shift, Down, resizeactive, 0 30

# Make window fullscreen
bind = Alt, Return, fullscreen,

# Center active window
bind = $mainMod+Shift, J, exec, $scrPath/center_active_window.sh

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic # Move To Special Workspace 

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Screenshot
#bind = , PRINT, exec, hyprshot -m region -o ~/Pictures/screenshots/
bind = , PRINT, exec, $scrPath/grimblast --notify copysave area # Take Screenshot (region)
bind = $mainMod, PRINT, exec, $scrPath/grimblast --notify copysave output # Take Screenshot (screen)

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume control 
bindl  = , XF86AudioMute, exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
bindl  = , XF86AudioMicMute, exec, $scrPath/volumecontrol.sh -i m # toggle microphone mute
bindel = , XF86AudioLowerVolume, exec, $scrPath/volumecontrol.sh -o d # decrease volume
bindel = , XF86AudioRaiseVolume, exec, $scrPath/volumecontrol.sh -o i #increase volume

# Brightness control
bindel = , XF86MonBrightnessUp, exec, $scrPath/brightnesscontrol.sh i # increase brightness
bindel = , XF86MonBrightnessDown, exec, $scrPath/brightnesscontrol.sh d # decrease brightness

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next # Play Next
bindl = , XF86AudioPause, exec, playerctl play-pause # Pause/Pause
bindl = , XF86AudioPlay, exec, playerctl play-pause # Play/Pause
bindl = , XF86AudioPrev, exec, playerctl previous # Play Previous

# Hyprpicker
bindl = $mainMod ALT, P, exec, hyprpicker -a -u 300 # Colorpicker (hex)

# Pyprland expose
bind = $mainMod, Tab, exec, pypr-client expose # Show all windows
workspace = special:exposed,gapsout:30,gapsin:10,bordersize:3,border:true,shadow:true
