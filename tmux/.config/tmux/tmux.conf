set -g prefix C-SPACE
unbind C-b
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

tmux_magenta="#a48cf2";
tmux_magenta_dark="#bf4f8e"
tmux_pink="#f265b5"
tmux_cyan="#04d1f9"
tmux_orange="#f7c67f"
tmux_yellow="#f1fc79"
tmux_green="#37f499"
tmux_red="#f16c75"
tmux_fg_inactive="#7081d0"
tmux_bg_dark="#171928"

set -g message-style "bg=default" # remove yellow message line
set -g mode-style "bg=${tmux_bg_dark}" # session selection
set -g pane-border-style "fg=${tmux_fg_inactive}"
set -g pane-active-border-style "fg=${tmux_magenta}"

# --- Status ---
set -g status-position top
set -g status-style "bg=default fg=${tmux_fg_inactive}"
set -g status-left ""

set -g status-justify right
set -g window-status-format "#I:#W"
set -g window-status-current-format "#[fg=${tmux_magenta}, bold]#I:#W"

set -g status-right " #[fg=${tmux_green} bold]| #{?client_prefix,#[fg=${tmux_magenta_dark} bold reverse],#[fg=${tmux_magenta_dark} bold]}#S#[noreverse]"

# --- Keybindings ---
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" # source config
bind b set -g status # toggle status
bind g neww -n "git" -S lazygit # lg in cwd
bind c new-window -c "#{pane_current_path}" # open in cwd
bind "|" split-window -hc "#{pane_current_path}" # mod split hrz to match nvim
bind "\\" split-window -vc "#{pane_current_path}" # mod split vir to match nvim
bind j choose-window 'join-pane -h -s "%%"' # join horizontaly
bind J choose-window 'join-pane -s "%%"' # join vertically
